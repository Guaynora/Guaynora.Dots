# hypridle — PC de sobremesa (sin brillo de pantalla/teclado)
general {
    lock_cmd = pidof hyprlock || hyprlock                             # evita varias instancias de hyprlock
    before_sleep_cmd = loginctl lock-session                          # bloquea antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # enciende la pantalla al volver
}

listener {
    timeout = 300                                 # 5 min: bloquear
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                                 # 5.5 min: apagar pantalla
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800                                # 30 min: suspender
    on-timeout = systemctl suspend
}
