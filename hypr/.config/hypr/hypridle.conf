# hypridle — desktop PC (no screen/keyboard backlight)
general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn the screen on after resume
}

listener {
    timeout = 300                                 # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                                 # 5.5 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# No auto-suspend: with nvidia-open 615 the LG ultrawide on DisplayPort
# stays black after resume. Lock + screen off is enough for a desktop.
