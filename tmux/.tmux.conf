# ~/.tmux.conf — prefijo por defecto: Ctrl + b

set -g default-shell /usr/bin/zsh
set -g mouse on                       # clic para cambiar de panel, rueda para scroll, arrastrar para redimensionar
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1                   # ventanas empiezan en 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g set-clipboard on

# Divisiones: | y - además de las de siempre " y % (todas en el mismo directorio)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Moverse entre paneles con Alt + flechas (sin prefijo)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Recargar config
bind r source-file ~/.tmux.conf \; display "Config recargada"

# Copiar con estilo vi (prefijo + [ , v para seleccionar, y para copiar)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Barra de estado
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
